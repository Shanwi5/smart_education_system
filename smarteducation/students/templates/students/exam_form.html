{% extends 'base.html' %}
{% block title %}Add Exam{% endblock %}
{% block page_title %}Add Exam{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8">
    <div class="stat-card">
        <h5 class="fw-bold mb-4"><i class="bi bi-pencil-square me-2"></i>Add Exam</h5>
        <form method="POST">{% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3"><label class="form-label">Exam Name *</label><input type="text" name="name" class="form-control" required></div>
                <div class="col-md-6 mb-3"><label class="form-label">Subject *</label><select name="subject" class="form-select" required><option value="">Select Subject</option>{% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
                <div class="col-md-4 mb-3"><label class="form-label">Exam Type</label><select name="exam_type" class="form-select"><option value="midterm">Midterm</option><option value="final">Final</option><option value="quiz">Quiz</option><option value="assignment">Assignment</option></select></div>
                <div class="col-md-4 mb-3"><label class="form-label">Total Marks</label><input type="number" name="total_marks" class="form-control" value="100"></div>
                <div class="col-md-4 mb-3"><label class="form-label">Date *</label><input type="date" name="date" class="form-control" required></div>
            </div>
            <button type="submit" class="btn btn-primary" style="background: var(--primary); border: none;"><i class="bi bi-check-lg me-1"></i>Create</button>
            <a href="{% url 'exam_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
    </div>
</div></div>
{% endblock %}
